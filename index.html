<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0e1a;color:#e2e8f0;line-height:1.65}
header{background:#111827;padding:14px 20px;display:flex;justify-content:space-between;border-bottom:2px solid #00d4ff;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50}
header h1{color:#00d4ff;font-size:1rem;cursor:pointer}
.stats{color:#94a3b8;font-size:0.85rem}
.stats b{color:#00d4ff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#111827;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #263243}
h2{color:#00d4ff;margin-bottom:10px;font-size:1.3rem}
h3{color:#22c55e;margin:14px 0 8px;font-size:1rem}
p{margin:8px 0}
ul,ol{padding-left:22px;margin:8px 0}
li{margin-bottom:4px}
code{background:#1f2937;padding:2px 6px;border-radius:4px;color:#00d4ff;font-size:0.9em}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:0.9em}
th,td{border:1px solid #1f2937;padding:8px;text-align:left}
th{background:#1f2937;color:#00d4ff}
a{color:#00d4ff}
.meta{display:flex;gap:12px;font-size:0.8rem;color:#94a3b8;margin-bottom:8px;flex-wrap:wrap}
.intro{background:#0c4a6e;padding:14px;border-radius:10px;margin:12px 0;border-left:4px solid #00d4ff}
.analogy{background:#164e63;padding:12px;border-radius:10px;margin:12px 0;border-left:4px solid #22d3ee;font-style:italic}
.section{background:#0f172a;padding:16px;border-radius:10px;margin:14px 0;border-left:4px solid #a78bfa}
.section h3{color:#c4b5fd;margin-top:0}
.why{background:#4c1d95;padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid #a78bfa}
.bank{background:#14532d;padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid #4ade80}
.glo{background:#1e293b;padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid #94a3b8}
.glo b{color:#fbbf24}
.pr{background:#052e16;padding:14px;border-radius:10px;margin:14px 0;border-left:4px solid #22c55e}
.er{background:#7f1d1d;padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid #ef4444}
.df{background:#78350f;padding:12px;border-radius:8px;margin:12px 0;border-left:3px solid #fbbf24}
.car{background:#1e1b4b;padding:14px;border-radius:10px;margin:12px 0;border-left:4px solid #a78bfa}
.svg-box{background:#050914;border-radius:10px;padding:16px;margin:14px 0;text-align:center;border:1px solid #1e293b}
.svg-box svg{max-width:100%;height:auto;display:block;margin:0 auto}
.quiz{background:#1f2937;padding:14px;border-radius:10px;margin-top:14px}
.q{margin-bottom:14px}
.q label{display:block;padding:9px 12px;margin:5px 0;background:#111827;border-radius:7px;cursor:pointer}
.q label:hover{background:#334155}
.q input{margin-right:10px}
.ok{background:#14532d!important;border-left:4px solid #22c55e!important}
.ko{background:#7f1d1d!important;border-left:4px solid #ef4444!important}
.exp{background:#050914;padding:10px;border-radius:6px;margin-top:8px;font-size:0.85em;color:#cbd5e1;border-left:3px solid #fbbf24;display:none}
.nav{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
button{background:#00d4ff;color:#0a0e1a;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem}
button:hover{background:#5ee0ff}
button.sec{background:#1f2937;color:#e2e8f0}
button.gold{background:#fbbf24;color:#0a0e1a}
button.exam{background:#a855f7;color:#fff}
button.exam:hover{background:#c084fc}
.res{margin-top:12px;padding:12px;border-radius:8px;font-weight:700;text-align:center}
.res.g{background:#14532d;color:#86efac}
.res.r{background:#7f1d1d;color:#fca5a5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.btn{background:#1f2937;padding:10px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.btn:hover{border-color:#00d4ff}
.btn.done{border-color:#22c55e;background:#14532d}
.btn .n{font-weight:800;color:#00d4ff;display:block;font-size:0.75rem}
.btn.done .n{color:#22c55e}
.btn .ti{display:block;font-size:0.78rem;color:#94a3b8;margin-top:2px}
.stat{background:#1e293b;padding:16px;border-radius:12px;border-left:4px solid #00d4ff;text-align:center}
.stat .big{font-size:2em;font-weight:800;color:#00d4ff;display:block}
.stat .lbl{font-size:0.85em;color:#94a3b8}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.cert{background:#0c4a6e;padding:14px;border-radius:10px;margin:10px 0;border-left:4px solid #00d4ff}
.cert h4{color:#7dd3fc;margin:0 0 6px}
.cert.done{background:#14532d;border-left-color:#22c55e}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.7em;font-weight:700;margin-left:6px}
.badge.free{background:#14532d;color:#86efac}
.badge.partial{background:#78350f;color:#fde68a}
.badge.exam{background:#a855f7;color:#fff}
.job{background:#1f2937;padding:12px;border-radius:10px;border-left:4px solid #22c55e;margin-bottom:10px}
.job h4{margin:0 0 4px;color:#86efac}
.exam-card{background:linear-gradient(135deg,#4c1d95 0%,#1e1b4b 100%);padding:16px;border-radius:12px;margin:12px 0;border-left:4px solid #a855f7}
.exam-card h4{color:#e9d5ff;margin:0 0 8px;font-size:1.05rem}
.exam-card.locked{opacity:0.6;border-left-color:#475569;background:#1e293b}
.exam-card.passed{background:linear-gradient(135deg,#14532d 0%,#052e16 100%);border-left-color:#22c55e}
.exam-card.passed h4{color:#86efac}
.exam-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.72em;font-weight:800;margin-bottom:6px}
.exam-badge.locked{background:#334155;color:#94a3b8}
.exam-badge.ready{background:#7c3aed;color:#fff}
.exam-badge.passed{background:#22c55e;color:#052e16}
.qcount{color:#cbd5e1;font-size:0.85em;margin:6px 0}
footer{text-align:center;padding:20px;color:#94a3b8;font-size:0.78em}
</style>
</head>

var D = [
{id:1,t:"Composants d'un ordinateur",d:50,
intro:"Un ordinateur est une machine composee de plusieurs pieces materielles qui collaborent pour traiter l'information. Chaque composant joue un role precis dans la chaine de traitement.",
analogy:"Comme une cuisine : le cuisinier (CPU) execute la recette, le plan de travail (RAM) est l'espace temporaire, le garde-manger (disque) est le stockage permanent, la carte mere est le plan de travail principal qui relie tout.",
sections:[
{titre:"Les composants internes",contenu:"<p>Un ordinateur contient plusieurs composants essentiels qui travaillent ensemble :</p><ul><li><b>CPU (processeur)</b> : le cerveau, execute les calculs et instructions. Un CPU moderne a 2, 4, 8 coeurs et tourne a 2-4 GHz.</li><li><b>RAM (memoire vive)</b> : memoire temporaire ultra-rapide qui stocke les donnees actives. Elle est volatile : effacee a l'extinction.</li><li><b>Disque dur (HDD ou SSD)</b> : stockage permanent des fichiers et du systeme. Les donnees restent meme hors tension.</li><li><b>Carte mere</b> : circuit imprime principal qui relie tous les composants via des bus de donnees.</li><li><b>Alimentation</b> : convertit le courant et fournit l'energie.</li><li><b>Ventirad</b> : refroidit le CPU.</li></ul>",svg:"PC"},
{titre:"Les peripheriques externes",contenu:"<p>Les peripheriques sont les appareils connectes a l'ordinateur :</p><ul><li><b>Entree</b> : clavier, souris, scanner, webcam, microphone. Ils envoient des donnees.</li><li><b>Sortie</b> : ecran, imprimante, haut-parleurs. Ils restituent l'information.</li><li><b>Entree/Sortie</b> : cle USB, disque externe, carte reseau. Ils peuvent envoyer et recevoir.</li></ul><p>Connexions : USB, HDMI, RJ45 (reseau), jack audio, DisplayPort, USB-C.</p>"},
{titre:"Le bus : autoroute interne",contenu:"<p>Le bus est le chemin par lequel circulent les donnees entre les composants. Trois types existent :</p><ul><li>Bus de donnees : transporte les informations.</li><li>Bus d'adresses : indique ou lire/ecrire.</li><li>Bus de controle : synchronise les echanges.</li></ul><p>Si la RAM sature, le systeme utilise le disque en secours (swap), ce qui divise les performances par environ 1000.</p>"}
],
why:"Chaque composant est une surface d'attaque. Un attaquant peut exploiter une faille du CPU (Meltdown, Spectre), compromettre le BIOS, voler un disque non chiffre, ou utiliser un port USB (BadUSB).",
bank:"Dans une banque, les postes contiennent des donnees de comptes. Un disque vole non chiffre expose ces donnees : violation BCEAO, amende, perte de confiance. Un BIOS infecte peut exfiltrer sans detection.",
glo:"<b>CPU</b> : processeur. <b>RAM</b> : memoire volatile. <b>SSD/HDD</b> : stockage. <b>Bus</b> : autoroute des donnees.",
pr:["Ouvrez le boitier ou suivez un tutoriel de demontage.","Reperez le CPU sous son ventilateur (composant carre au centre).","Comptez les barrettes de RAM dans leurs slots.","Identifiez le disque : boitier metallique (HDD) ou barrette M.2 (SSD).","Listez les ports externes : USB, HDMI, RJ45, jack.","Dessinez un schema avec au moins 5 composants."],
er:"Ne confondez pas RAM (barrettes amovibles) et disque (boitier/M.2). La RAM perd son contenu a l'extinction, pas le disque.",
df:"Realisez un schema ou une photo annotee de votre PC avec 5 composants identifies.",
proj:"Rapport d'audit materiel : schema + inventaire des composants.",
q:[{q:"La RAM est une memoire :",a:["Permanente","Volatile","Externe","Optique"],c:1,e:"La RAM s'efface sans alimentation."},{q:"Le composant qui execute les instructions :",a:["Ecran","Processeur","Clavier","Disque"],c:1,e:"Le CPU execute les instructions."}]},

{id:2,t:"Le processeur (CPU)",d:40,
intro:"Le CPU (Central Processing Unit) est le cerveau de l'ordinateur. Il execute toutes les instructions des programmes en un cycle repete des milliards de fois par seconde.",
analogy:"Un chef cuisinier lit une recette (Fetch), la comprend (Decode), puis la realise (Execute). Plusieurs commis (coeurs) travaillent en parallele pour aller plus vite.",
sections:[
{titre:"Le cycle Fetch-Decode-Execute",contenu:"<p>Chaque instruction suit un cycle en 3 phases :</p><ol><li><b>Fetch (lire)</b> : le CPU va chercher l'instruction suivante en memoire.</li><li><b>Decode (decoder)</b> : il comprend ce qu'il doit faire.</li><li><b>Execute (executer)</b> : il realise l'action et stocke le resultat.</li></ol><p>Ce cycle se repete des milliards de fois par seconde. Un CPU a 3 GHz effectue 3 milliards de cycles par seconde.</p>",svg:"CPU"},
{titre:"Coeurs et frequence",contenu:"<p>Les processeurs modernes possedent plusieurs coeurs : dual (2), quad (4), octo (8). Chaque coeur peut executer des instructions en parallele. La frequence (en GHz) indique la vitesse de chaque coeur.</p><p>Attention : plus de GHz ne signifie pas toujours plus rapide. Un CPU octo-core a 2 GHz peut etre plus performant qu'un dual-core a 3,5 GHz selon l'architecture.</p>"},
{titre:"Le cache : memoire ultra-rapide",contenu:"<p>Le cache est une memoire ultra-rapide integree au CPU (L1, L2, L3). Il stocke les instructions et donnees les plus utilisees, evitant d'aller en RAM (plus lente). L1 : 32-64 Ko, L2 : quelques Mo, L3 : jusqu'a 32 Mo.</p><p>Les deux principaux fabricants sont Intel (Core i3/i5/i7/i9) et AMD (Ryzen 3/5/7/9). Chaque CPU a un socket specifique sur la carte mere.</p>"}
],
why:"Les failles materielles (Meltdown 2018, Spectre 2018, Rowhammer) exploitent le CPU. Un cryptominer utilise votre CPU a 100% sans ecrire sur le disque, ce qui le rend furtif.",
bank:"Un serveur bancaire a 100% CPU sans raison est un signal d'alerte : cryptominer ou deni de service. Un analyste SOC doit savoir lire l'activite CPU.",
glo:"<b>Coeur</b> : unite de calcul. <b>Frequence</b> : GHz. <b>Cache</b> : memoire rapide. <b>Socket</b> : connecteur.",
pr:["Windows : Ctrl+Shift+Echap > Performance > CPU.","Linux : tapez lscpu.","Notez modele, coeurs, frequence.","Ouvrez 20 onglets et observez la charge.","Identifiez le processus le plus gourmand."],
er:"Ne croyez pas qu'un CPU avec plus de GHz est toujours plus rapide : architecture et coeurs comptent.",
df:"Fiche technique du CPU : modele, coeurs, frequence.",
proj:"Fiche technique CPU a publier sur GitHub.",
q:[{q:"Les 3 phases du cycle CPU :",a:["Read/Write/Print","Fetch/Decode/Execute","Open/Close/Save","Load/Store/Drop"],c:1,e:"Fetch - Decode - Execute."},{q:"Un processeur octo-core possede :",a:["8 GHz","8 coeurs","8 Go RAM","8 To disque"],c:1,e:"Octo = 8 coeurs."}]},

{id:3,t:"La memoire RAM",d:35,
intro:"La RAM (Random Access Memory) est la memoire de travail de l'ordinateur. Elle stocke temporairement les donnees utilisees activement par le systeme et les applications.",
analogy:"La RAM est le plan de travail de votre cuisine. Vous y posez les ingredients en cours d'utilisation. Si le plan est plein, vous rangez par terre (swap) : tout devient lent.",
sections:[
{titre:"Volatile et rapide",contenu:"<p>La RAM est <b>volatile</b> : elle est effacee des qu'on coupe l'alimentation. Elle est <b>tres rapide</b> : acces en nanosecondes, contre des millisecondes pour un disque.</p><p>Capacite courante : 8, 16, 32, 64 Go. Generations : DDR4, DDR5. Une barrette DDR5-4800 transfere 38,4 Go/s.</p>",svg:"RAM"},
{titre:"Le swap : plan B du systeme",contenu:"<p>Quand la RAM sature, le systeme utilise le <b>swap</b> (memoire virtuelle sur le disque). Un disque est environ 1000 fois plus lent que la RAM. L'ordinateur devient extremement lent : c'est le swap thrashing.</p><p>Sur Linux, on cree une partition de swap (2-4 Go). Sur Windows, c'est le fichier pagefile.sys.</p>"},
{titre:"Barrettes et dual channel",contenu:"<p>La RAM se presente en barrettes DIMM (PC bureau) ou SO-DIMM (laptops). Elles s'installent dans des slots sur la carte mere. Pour profiter du dual channel (double canal), il faut deux barrettes identiques dans les bons slots. Cela double la bande passante.</p>"}
],
why:"Les malwares furtifs (fileless malware) vivent uniquement en RAM sans ecrire sur le disque. Une analyse memoire permet de retrouver des cles de chiffrement, mots de passe en clair, connexions actives.",
bank:"Un poste avec 8 Go de RAM qui sature provoque des erreurs de saisie. Un serveur dont la RAM est saturee par un malware peut tomber, bloquant les transactions.",
glo:"<b>Volatile</b> : perdu sans courant. <b>Swap</b> : memoire sur disque. <b>DDR4/DDR5</b> : generations.",
pr:["Ouvrez 15 onglets + une VM.","Gestionnaire > Memoire (Win) ou htop (Linux).","Notez RAM totale/utilisee.","Fermez la moitie et observez."],
er:"Ne confondez pas 16 Go de RAM et 16 Go de disque : deux espaces distincts.",
df:"Captures RAM avant/apres fermeture d'applications.",
proj:"Rapport de consommation memoire.",
q:[{q:"Quand la RAM sature :",a:["Le PC s'arrete","Utilise le swap disque","Redemarre","Efface tout"],c:1,e:"Le swap prend le relais (1000x plus lent)."},{q:"La RAM est volatile car :",a:["Chere","Perdue sans courant","Lente","Externe"],c:1,e:"Sans courant, elle s'efface."}]},

{id:4,t:"HDD et SSD",d:35,
intro:"Le stockage permanent se fait sur un disque dur (HDD) ou un disque a etat solide (SSD). Ces deux technologies ont des performances tres differentes.",
analogy:"Le HDD est un tourne-disque : des plateaux magnetiques qui tournent. Le SSD est une cle USB geante : aucune piece mobile, tout est electronique.",
sections:[
{titre:"HDD : mecanique et economique",contenu:"<p>Technologie de 1956. Des plateaux magnetiques tournent a 5400/7200 tr/min et une tete lit/ecrit.</p><p><b>Avantages</b> : grande capacite (20 To), prix au To bas (~20 euros/To).</p><p><b>Inconvenients</b> : lent (100-200 Mo/s), fragile, bruyant.</p>",svg:"DISK"},
{titre:"SSD : rapide et resistant",contenu:"<p>Memoire flash NAND, aucune piece mobile.</p><p><b>Avantages</b> : tres rapide (500 Mo/s SATA, 3-7 Go/s NVMe), silencieux, resistant aux chocs.</p><p><b>Inconvenients</b> : plus cher au Go (~80 euros/To), duree de vie limitee par les ecritures (5-10 ans).</p>"},
{titre:"En pratique et securite",contenu:"<p>SSD pour OS et logiciels (gain de rapidite). HDD pour archives et gros fichiers. NVMe pour postes exigeants. Un NVMe atteint 7000 Mo/s (35x un HDD).</p><p><b>Securite</b> : BitLocker (Windows) et LUKS (Linux) chiffrent tout le disque. Un fichier supprime reste recuperable jusqu'a ecrasement : utilisez shred ou sdelete.</p>"}
],
why:"Un disque non chiffre est lisible par quiconque le vole. BitLocker/LUKS protegent. Un fichier supprime reste recuperable.",
bank:"Les laptops bancaires contiennent des donnees clients. Un vol non chiffre = incident majeur. Les SSD compliquent l'analyse forensique (TRIM).",
glo:"<b>HDD</b> : mecanique. <b>SSD</b> : flash. <b>NVMe</b> : ultra-rapide. <b>BitLocker/LUKS</b> : chiffrement.",
pr:["diskmgmt.msc (Win) ou lsblk (Linux).","Notez capacite et espace libre.","Identifiez HDD/SSD.","CrystalDiskInfo pour la sante."],
er:"Un fichier supprime n'est pas reellement efface. Utilisez shred/sdelete.",
df:"Liste de vos disques : type, capacite, pourcentage libre.",
proj:"Rapport d'inventaire de stockage.",
q:[{q:"SSD rapide car :",a:["Tourne vite","Pas de pieces mobiles","Plus gros","Moins cher"],c:1,e:"100% electronique."},{q:"Pour archiver 4 To :",a:["SSD 512 Go","HDD 4 To","Cle USB","RAM"],c:1,e:"Meilleur prix/To."}]},

{id:5,t:"BIOS et UEFI",d:40,
intro:"Le BIOS ou son successeur UEFI est le tout premier logiciel execute au demarrage. Stocke sur une puce de la carte mere, il lance tout le processus.",
analogy:"Le BIOS est le chef d'orchestre qui, avant le concert, verifie les instruments et decide qui commence a jouer.",
sections:[
{titre:"Les roles du BIOS/UEFI",contenu:"<p>Au demarrage, le BIOS :</p><ul><li><b>Initialise le materiel</b> via le POST (Power On Self Test).</li><li><b>Choisit le peripherique de demarrage</b> (Boot Order).</li><li><b>Fournit des reglages bas niveau</b> (date, heure, voltage).</li><li><b>Gere la securite</b> (mot de passe BIOS, Secure Boot).</li></ul>",svg:"BIOS"},
{titre:"UEFI vs BIOS",contenu:"<p>UEFI remplace le BIOS depuis 2010.</p><p><b>Avantages</b> : interface graphique, support >2 To, demarrage rapide, et surtout <b>Secure Boot</b> qui verifie la signature cryptographique des logiciels de demarrage (empeche les bootkits).</p>"},
{titre:"Secure Boot en detail",contenu:"<p>Secure Boot verifie que le bootloader (GRUB, Windows Boot) est signe par une cle de confiance. Un bootloader modifie est rejete. Ubuntu utilise des bootloaders signes Microsoft ; Arch/Gentoo demandent de desactiver Secure Boot ou signer manuellement.</p>"}
],
why:"Un rootkit firmware (LoJax 2018) infecte le BIOS/UEFI et survit a une reinstallation. Quasi indetectable. Secure Boot est une defense essentielle.",
bank:"Les banques doivent activer Secure Boot pour empecher un attaquant de demarrer un OS pirate via cle USB sur un laptop vole.",
glo:"<b>POST</b> : test materiel. <b>Boot Order</b> : ordre. <b>Secure Boot</b> : signatures.",
pr:["Redemarrez > F2/Suppr/F10.","Notez la version.","Verifiez Boot Order.","Verifiez Secure Boot.","Sortez sans sauvegarder."],
er:"Ne modifiez jamais un reglage BIOS sans avoir photographie l'etat d'origine.",
df:"Photo BIOS avec version et Secure Boot.",
proj:"Fiche BIOS : version, Secure Boot, ordre de boot.",
q:[{q:"Le BIOS est :",a:["Logiciel user","Firmware","Antivirus","Pilote"],c:1,e:"Firmware sur puce."},{q:"Secure Boot :",a:["Chiffre","Bloque boot non signe","Accelere","Bloque Wi-Fi"],c:1,e:"Verifie les signatures."}]},

{id:6,t:"Installer Windows",d:75,
intro:"Savoir installer Windows proprement est fondamental en cybersecurite. C'est la premiere etape pour repartir sur une base saine apres une compromission.",
analogy:"Reinstaller Windows, c'est comme nettoyer un magasin apres un cambriolage : on vide tout, on repare, on change les serrures.",
sections:[
{titre:"Pre-requis",contenu:"<ul><li>ISO officielle de microsoft.com/software-download.</li><li>Cle USB de 8 Go minimum.</li><li>Rufus (Windows) ou balenaEtcher pour creer la cle bootable.</li><li>Cle de licence Windows.</li></ul>"},
{titre:"Etapes d'installation",contenu:"<ol><li>Telecharger l'ISO sur microsoft.com.</li><li>Creer la cle bootable avec Rufus.</li><li>Demarrer sur la cle (F12 ou F2).</li><li>Suivre l'assistant : langue, disque, compte.</li><li>Post-installation : Windows Update, pilotes, antivirus.</li><li>Snapshot si VM.</li></ol>"},
{titre:"Post-installation : durcissement",contenu:"<ul><li>Windows Update jusqu'a la derniere version.</li><li>Pilotes depuis le fabricant.</li><li>Antivirus : Windows Defender suffit.</li><li>BitLocker si donnees sensibles.</li><li>Compte utilisateur standard (pas admin au quotidien).</li></ul>"}
],

{id:7,t:"Installer Ubuntu",d:60,

{titre:"Choisir la version",contenu:"<p><b>LTS (Long Term Support)</b> : 5 ans de support. Version actuelle : 22.04 ou 24.04 LTS. A privilegier pour la stabilite. Les versions intermediaires (9 mois) sont a eviter.</p>"},
{titre:"Installation en VM",contenu:"<ol><li>VirtualBox : Linux, Ubuntu 64-bit, 4 Go RAM, 25 Go.</li><li>Inserer l'ISO Ubuntu.</li><li>Demarrer, suivre l'installateur.</li><li>Choisir Effacer le disque.</li><li>Configurer langue, clavier, utilisateur.</li><li>sudo apt update et sudo apt upgrade.</li></ol>"},
{titre:"Pourquoi Linux en cyber",contenu:"<p>Linux domine en cybersecurite : serveurs, outils (Nmap, Metasploit, Wireshark), distributions specialisees (Kali). Savoir l'installer et le securiser est un pre-requis pour tout analyste SOC.</p>"}

{id:8,t:"Role du systeme d'exploitation",d:35,
intro:"L'OS est le logiciel principal qui fait fonctionner l'ordinateur. Il gere le materiel, les applications, les fichiers, les utilisateurs et la securite.",
analogy:"L'OS est le chef d'orchestre : il ne joue pas d'instrument, mais coordonne tous les musiciens.",
sections:[
{titre:"Les fonctions de l'OS",contenu:"<ul><li><b>Gestion du materiel</b> : lien entre apps et composants.</li><li><b>Gestion des processus</b> : ordonnancement.</li><li><b>Gestion memoire</b> : allocation de la RAM.</li><li><b>Gestion des fichiers</b> : organisation sur disque (NTFS, ext4).</li><li><b>Gestion utilisateurs</b> : controle d'acces.</li><li><b>Securite</b> : permissions, journalisation.</li></ul>",svg:"OS"},
{titre:"Les familles d'OS",contenu:"<table><tr><th>OS</th><th>Filesystem</th><th>Usage</th></tr><tr><td>Windows</td><td>NTFS</td><td>Bureautique, entreprise</td></tr><tr><td>macOS</td><td>APFS</td><td>Creation, dev</td></tr><tr><td>Linux</td><td>ext4, xfs</td><td>Serveurs, securite</td></tr><tr><td>Android</td><td>ext4, f2fs</td><td>Mobile</td></tr><tr><td>iOS</td><td>APFS</td><td>iPhone, iPad</td></tr></table>"},
{titre:"Architecture en couches",contenu:"<p>Un OS est organise en couches :</p><ul><li><b>Kernel (noyau)</b> : coeur, acces materiel.</li><li><b>Shell</b> : interface (bash, PowerShell).</li><li><b>Applications</b> : programmes utilisateur.</li></ul><p>Un attaquant qui obtient le kernel controle toute la machine.</p>"}
],

bank:"Les banques durcissent leurs systemes selon CIS, ANSSI. Un poste Windows non durci = services inutiles, partages ouverts, comptes par defaut.",
glo:"<b>Kernel</b> : noyau. <b>Shell</b> : interface. <b>NTFS/ext4/APFS</b> : filesystems.",
pr:["Identifier OS (winver/lsb_release).","uname -a pour le kernel.","Reperer racine.","Lister utilisateurs."],

{id:9,t:"Organiser ses fichiers",d:35,

sections:[
{titre:"Bonnes pratiques",contenu:"<ul><li>Arborescence logique (Documents/Projets/Client/2025).</li><li>Nommage date (2025-03-15_rapport.pdf).</li><li>Eviter les caracteres speciaux (ils cassent les scripts).</li><li>README.md dans chaque dossier.</li><li>Pas d'espaces dans chemins de scripts.</li></ul>",svg:"FILES"},

{id:11,t:"Installer un logiciel",d:35,
intro:"Installer un logiciel proprement, sans malware, est une competence fondamentale. Les installateurs compromis sont une source majeure d'infection.",
analogy:"Installer un logiciel, c'est acheter un medicament : verifier la pharmacie (source), la date (signature), la notice (installation personnalisee).",
sections:[
{titre:"Sources sures",contenu:"<ul><li>Site officiel de l'editeur (premiere option).</li><li>Microsoft Store / Snap Store / App Store.</li><li>Depots Linux (apt, dnf) : paquets signes.</li><li>winget (Windows) : gestionnaire Microsoft.</li></ul><p>Eviter les sites tiers, torrents, cracks.</p>"},
{titre:"Verifier la signature",contenu:"<p>Windows : clic droit > Proprietes > Signatures numeriques. Si valide et du bon editeur, le fichier est authentique. Sur Linux, apt verifie automatiquement.</p>"},
{titre:"Installation personnalisee",contenu:"<p>Beaucoup d'installateurs gratuits embarquent des adwares (barres d'outils). Choisir toujours Personnalisee et decocher les extras.</p>"}
],
why:"60% des infections viennent d'installateurs compromis. Un logiciel pirate peut contenir un cheval de Troie.",
bank:"Les banques interdisent les logiciels non approuves. Un logiciel compromis exfiltre des donnees bancaires.",
glo:"<b>Signature</b> : authenticite. <b>Adware</b> : pub. <b>winget</b> : gestionnaire Windows.",
pr:["VLC sur videolan.org.","Verifier signatures.","Personnalisee.","Decocher extras."],
er:"Suivant sans lire = adwares.",
df:"VLC propre installe.",
proj:"Rapport installation propre.",

{id:12,t:"Desinstaller un logiciel",d:25,
intro:"Desinstaller proprement est aussi important qu'installer. Un logiciel mal desinstalle laisse fichiers, services et entrees registre.",
analogy:"Demenager : retirer la plaque ne suffit pas. Il faut vider les placards et rendre les cles.",
sections:[
{titre:"Windows",contenu:"<ol><li>Parametres > Applications > Applications et fonctionnalites.</li><li>Selectionner et desinstaller.</li><li>Revo Uninstaller ou BCUninstaller pour nettoyage complet.</li></ol>"},
{titre:"Linux",contenu:"<p>sudo apt remove nom_logiciel. sudo apt autoremove. sudo apt purge (+ config).</p><p>Verifier avec which nom_logiciel : doit dire not found.</p>"},
{titre:"Les residus",contenu:"<ul><li>Program Files (Windows) ou /usr/bin (Linux).</li><li>AppData (Windows) ou ~/.config (Linux).</li><li>Registre (Windows).</li><li>Services qui tournent encore.</li></ul>"}
],
why:"Logiciels obsoletes non patches = failles dormantes. Nettoyer regulierement = reduire la surface d'attaque.",
bank:"Un poste bancaire avec logiciels inutilises non patches est une cible facile.",
glo:"<b>Purge</b> : app+config. <b>Autoremove</b> : orphelins. <b>Residu</b> : fichier restant.",
pr:["Desinstaller test.","Verifier Program Files/AppData.","apt remove + autoremove.","which donne not found."],
er:"Supprimer l'icone ne desinstalle pas.",

{id:13,t:"Mettre a jour un systeme",d:35,
intro:"Les mises a jour corrigent des vulnerabilites connues. Ne pas les appliquer revient a laisser la porte ouverte.",
analogy:"Mettre a jour, c'est changer les serrures apres un cambriolage : le correctif existe, ne pas l'appliquer c'est refuser de se proteger.",
sections:[
{titre:"80% des intrusions exploitent des failles patchees",contenu:"<p>80% des intrusions reussies exploitent des vulnerabilites connues et patchees. WannaCry (2017) a infecte 200 000+ machines via MS17-010, patchee 2 mois avant l'attaque.</p>"},
{titre:"Comment mettre a jour",contenu:"<p><b>Windows</b> : Parametres > Windows Update.</p><p><b>Linux</b> : sudo apt update ; sudo apt upgrade -y ; sudo apt full-upgrade -y ; sudo apt autoremove.</p><p><b>macOS</b> : Menu Pomme > Reglages > Mise a jour.</p>"},
{titre:"Redemarrer",contenu:"<p>Sur Linux, apres un full-upgrade du kernel, redemarrer. Message System restart required a ne pas ignorer.</p>"}
],
why:"La non-application des patchs est la premiere cause de compromission. Chaque jour de nouvelles CVE sortent.",
bank:"Une banque non patchee risque une amende reglementaire (BCEAO, PCI-DSS).",
glo:"<b>Patch</b> : correctif. <b>CVE</b> : identifiant de faille. <b>Kernel</b> : noyau.",

er:"Ne pas repousser indefiniment.",

{id:14,t:"Sauvegarder ses donnees",d:45,
intro:"La sauvegarde est votre filet de securite. Ransomware, panne, erreur, vol : sans sauvegarde, tout est perdu. Regle 3-2-1.",
analogy:"Comme une copie de la cle du coffre-fort chez un notaire : si vous perdez l'original, vous avez un plan B.",
sections:[
{titre:"La regle 3-2-1",contenu:"<p><b>3 copies</b> sur <b>2 supports differents</b> dont <b>1 hors site</b>. Exemple : PC + disque externe + cloud (Backblaze, OneDrive).</p>",svg:"BACKUP"},
{titre:"Types de sauvegarde",contenu:"<table><tr><th>Type</th><th>Description</th></tr><tr><td>Complete</td><td>Tout (lent)</td></tr><tr><td>Incrementale</td><td>Changements depuis la derniere</td></tr><tr><td>Differentielle</td><td>Changements depuis la derniere complete</td></tr></table>"},
{titre:"Outils",contenu:"<p><b>Linux</b> : rsync, tar, Borg, Duplicity.</p><p>rsync -av ~/Documents/ /media/usb/backup/</p><p><b>Windows</b> : robocopy, Macrium Reflect. <b>Cloud</b> : Backblaze, OneDrive.</p>"}
],

{id:15,t:"Restaurer une sauvegarde",d:35,
intro:"Une sauvegarde non testee n'existe pas. La seule chose qui compte en cas de crash, c'est de pouvoir restaurer.",
analogy:"Faire une repetition d'evacuation : si jamais teste, vous paniquerez au vrai incendie.",
sections:[
{titre:"Procedure",contenu:"<ol><li>Identifier la sauvegarde a restaurer.</li><li>Verifier son integrite (checksum).</li><li>Restaurer dans un dossier test d'abord.</li><li>Valider le contenu.</li><li>Remplacer les donnees defaillantes.</li></ol>"},
{titre:"Le checksum",contenu:"<p>Empreinte numerique calculee sur un fichier. Si les checksums de la sauvegarde et de l'original sont identiques, la sauvegarde est intacte.</p><p>sha256sum fichier_original fichier_restaure</p>"},
{titre:"Tester regulierement",contenu:"<p>Tester au moins une fois par trimestre. Beaucoup decouvrent au moment du crash que leurs sauvegardes sont corrompues.</p>"}
],
why:"Beaucoup pensent etre proteges jusqu'a ce qu'ils essaient de restaurer. Tester fait partie integrante de la strategie.",

{id:16,t:"Gestionnaire des taches",d:30,
intro:"Le gestionnaire des taches est le premier outil de diagnostic Windows. Il permet de voir tous les processus en cours et detecter une activite suspecte.",
analogy:"C'est le tableau de bord de votre voiture : vitesse (CPU), essence (RAM), voyants d'alerte (processus suspects).",
sections:[
{titre:"Onglets essentiels",contenu:"<ul><li><b>Processus</b> : apps et processus actifs, avec CPU/RAM/disque/reseau.</li><li><b>Performance</b> : graphiques temps reel.</li><li><b>Demarrage</b> : programmes au boot.</li><li><b>Details</b> : PID, chemins, ligne de commande.</li><li><b>Services</b> : services Windows.</li></ul>"},
{titre:"Detecter un malware",contenu:"<ul><li>CPU ou RAM anormalement eleve (100%).</li><li>Nom legerement different (svch0st.exe vs svchost.exe).</li><li>Chemin inhabituel : Users/Public, TEMP.</li><li>Signature numerique manquante.</li></ul>"},
{titre:"Exemples",contenu:"<p><b>Cryptominer</b> : 100% CPU permanent, nom aleatoire (xmrig), chemin AppData.</p><p><b>RAT</b> : connexion reseau sortante vers IP inconnue.</p>"}
],
why:"Detecter un processus malveillant = premier reflexe. Un cryptominer tourne a 100% CPU en arriere-plan et chauffe la machine.",
bank:"Un poste qui rame sans raison peut heberger un cryptominer ou un malware qui exfiltre des donnees.",
glo:"<b>PID</b> : identifiant processus. <b>Cryptominer</b> : malware mining. <b>RAT</b> : acces distant.",

{id:17,t:"Comprendre les processus",d:35,
intro:"Un processus est un programme en cours d'execution. Tout programme qui tourne est un processus, identifie par un PID.",
analogy:"Un processus, c'est un employe qui execute une tache. Vous pouvez lui demander gentiment d'arreter (SIGTERM) ou le licencier brutalement (SIGKILL).",
sections:[
{titre:"Caracteristiques",contenu:"<ul><li><b>PID</b> : identifiant unique.</li><li><b>PPID</b> : PID du parent.</li><li><b>Espace memoire</b> : isole.</li><li><b>Threads</b> : unites d'execution internes.</li></ul><p>Cycle : cree, pret, en execution, en attente, termine.</p>"},
{titre:"Commandes Linux",contenu:"<p>ps aux : tous. ps -ef : arborescent. top/htop : temps reel. pstree : arbre. kill PID : SIGTERM. kill -9 PID : SIGKILL. pkill nom : par nom.</p>"},
{titre:"Signaux",contenu:"<table><tr><th>Signal</th><th>Numero</th><th>Effet</th></tr><tr><td>SIGTERM</td><td>15</td><td>Arret propre</td></tr><tr><td>SIGKILL</td><td>9</td><td>Arret force</td></tr><tr><td>SIGHUP</td><td>1</td><td>Recharger config</td></tr><tr><td>SIGSTOP</td><td>19</td><td>Suspendre</td></tr></table>"}
],

bank:"Un serveur attaque peut voir ses ressources saturees par un fork bomb.",
glo:"<b>PID</b> : identifiant. <b>PPID</b> : parent. <b>Thread</b> : unite.",

{id:18,t:"Comprendre les services",d:35,
intro:"Un service (daemon Linux) est un programme qui tourne en arriere-plan, sans interface, pour rendre un service au systeme.",
analogy:"Un service, c'est un employe de nuit : il travaille sans etre vu mais est essentiel.",
sections:[
{titre:"Exemples",contenu:"<ul><li><b>Serveur web</b> (Apache, Nginx).</li><li><b>SSH</b> : connexion distante.</li><li><b>DNS</b> : resolution.</li><li><b>Pare-feu</b>.</li><li><b>Bluetooth</b>.</li></ul>"},
{titre:"Gerer Windows",contenu:"<p>services.msc liste tous les services : nom, statut, type de demarrage (automatique, manuel, desactive). On peut demarrer, arreter, desactiver.</p>"},
{titre:"Gerer Linux",contenu:"<p>systemctl status nom_service. systemctl start. systemctl stop. systemctl enable (au boot). systemctl disable. systemctl list-units --type=service.</p>"}
],

{id:19,t:"Installer des pilotes",d:40,
intro:"Un pilote (driver) est un logiciel qui permet a l'OS de communiquer avec un composant materiel.",
analogy:"Un pilote est un traducteur entre vous (l'OS) et un etranger (le materiel). Corrompu, il peut vous trahir.",

{titre:"Pourquoi sensibles",contenu:"<p>Les pilotes tournent en kernel mode (privileges max). Une faille peut compromettre tout le systeme. Failles critiques trouvees dans les GPU (NVIDIA CVE-2021-1076, AMD CVE-2021-27090).</p>"},
{titre:"Sources fiables",contenu:"<ul><li>Site officiel fabricant (NVIDIA, AMD, Intel, Dell, Lenovo).</li><li>Windows Update (certifies Microsoft).</li><li>Gestionnaires constructeur (Dell Update, Lenovo Vantage).</li><li>Depots Linux.</li></ul><p>Jamais de sites tiers, forums, torrents.</p>"},
{titre:"Commandes utiles",contenu:"<p><b>Windows</b> : devmgmt.msc. Un point d'exclamation jaune signale un probleme.</p><p><b>Linux</b> : lspci -k pour voir les pilotes charges.</p>"}
],

{titre:"Routine mensuelle",contenu:"<ul><li>Mises a jour OS et logiciels.</li><li>Scan antivirus complet.</li><li>Nettoyage fichiers temporaires.</li><li>Espace disque >15% libre.</li><li>Sauvegardes testees.</li><li>Audit comptes utilisateurs.</li><li>Redemarrage.</li></ul>"},
{titre:"Outils Windows",contenu:"<p>cleanmgr. sfc /scannow. DISM /Online /Cleanup-Image /RestoreHealth.</p>"},
{titre:"Outils Linux",contenu:"<p>sudo apt autoremove et autoclean. sudo journalctl --vacuum-time=7d. df -h. needrestart.</p>"}

],

{titre:"Lecture",contenu:"<p>-rwxr-xr-x 1 user group 1024 date fichier</p><p>Tiret = fichier, d = dossier, l = lien. rwx = user (7), r-x = group (5), r-x = others (5).</p>"},

],
why:"Mauvaises permissions = escalade de privileges. Un SUID mal configure = root. Un fichier world-writable = compromission.",
bank:"SUID mal configure = root immediat sur serveur. Audit regulier = hygiene.",
glo:"<b>u/g/o</b> : user/group/others. <b>chmod</b> : modifier.",
pr:["ls -l /etc.","Decoder rw-r--r--.","ls -l /etc/shadow.","Convertir 750."],
er:"chmod 777 = tout le monde peut tout.",

function isExamUnlocked(ex){
  // Tous les defis du module doivent etre valides
  for (var i = ex.from; i <= ex.to; i++){
    if (!state.done[i]) return false;
  }
  return true;
}
function isExamPassed(ex){
  return !!(state.exams && state.exams[ex.id] && state.exams[ex.id].passed);
}
function passedExamsCount(){
  if (!state.exams) return 0;
  return Object.keys(state.exams).filter(function(k){ return state.exams[k].passed; }).length;
}

function validate(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  var correct = 0;
  d.q.forEach(function(q, i){
    var sel = document.querySelector('input[name="q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    if (sel && +sel.value === q.c) correct++;
  });
  
  var ok = correct === d.q.length;
  var dejaValide = !!state.done[id];
  document.getElementById('res').innerHTML = '<div class="res ' + (ok?'g':'r') + '">' + (ok ? 'Defi ' + d.id + ' valide !' : 'Score : ' + correct + '/' + d.q.length + ' - Reessayez') + '</div>';
  
  if (ok && !dejaValide) {
    state.done[id] = new Date().toISOString();
    save();
    updateProg();
    // Suggere examen si module complet
    var exam = EXAMS.filter(function(e){ return e.from <= id && e.to >= id; })[0];
    if (exam && isExamUnlocked(exam) && !isExamPassed(exam)) {
      document.getElementById('res').innerHTML += '<div class="res g" style="margin-top:8px">Module complete ! <a href="#" onclick="startExam(\'' + exam.id + '\');return false;">Passer l\'examen final</a></div>';
    }
  }
}

var currentExam = null;

function startExam(id){
  var ex = EXAMS.filter(function(e){ return e.id === id; })[0];
  if (!ex) return;
  if (!isExamUnlocked(ex)) { alert("Validez d'abord tous les defis du module."); return; }
  currentExam = ex;
  
  var html = '<div class="card"><div class="meta"><small>Examen ' + ex.id + '</small><small>' + ex.questions.length + ' questions</small><small>Seuil ' + Math.round(EXAM_PASS_RATIO*100) + '%</small></div>';
  html += '<h2>' + ex.titre + '</h2>';
  html += '<div class="intro"><p><b>Instructions :</b> Repondez a toutes les questions. Il faut au moins ' + Math.ceil(ex.questions.length * EXAM_PASS_RATIO) + '/' + ex.questions.length + ' bonnes reponses pour valider. Les corrections s\'affichent apres validation.</p></div>';
  html += '<div class="quiz" id="examQuiz">';
  
  ex.questions.forEach(function(q, i){
    html += '<div class="q" data-qi="' + i + '"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="exam_q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exam_exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Annuler</button><button class="exam" onclick="submitExam()">Valider l\'examen</button></div><div id="exam_res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function submitExam(){
  if (!currentExam) return;
  var ex = currentExam;
  var correct = 0;
  var details = [];
  
  ex.questions.forEach(function(q, i){
    var sel = document.querySelector('input[name="exam_q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="exam_q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exam_exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    var ok = sel && +sel.value === q.c;
    if (ok) correct++;
    details.push({q: q.q, ok: ok, correct: q.a[q.c], chosen: sel ? q.a[+sel.value] : '(aucune)'});
  });
  
  var ratio = correct / ex.questions.length;
  var passed = ratio >= EXAM_PASS_RATIO;
  var existing = state.exams[ex.id];
  // On enregistre seulement si c'est un nouveau record
  if (!existing || !existing.passed || correct > existing.score) {
    state.exams[ex.id] = {
      score: correct,
      total: ex.questions.length,
      passed: passed,
      date: new Date().toISOString()
    };
    save();
  }
  
  var msg = '';
  if (passed) {
    msg = '<div class="res g">Examen REUSSI ! ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
    if (!existing || !existing.passed) {
      msg += '<div class="res g" style="margin-top:8px">Felicitations, module valide ! Certificat de module debloque.</div>';
    }
  } else {
    msg = '<div class="res r">Examen echoue : ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%) - Il faut ' + Math.ceil(ex.questions.length*EXAM_PASS_RATIO) + '/' + ex.questions.length + '</div>';
  }
  
  // Detail
  msg += '<div class="card" style="margin-top:12px"><h3>Detail des reponses</h3><table><tr><th>#</th><th>Question</th><th>Votre reponse</th><th>Bonne reponse</th><th>Statut</th></tr>';
  details.forEach(function(d, i){
    msg += '<tr><td>' + (i+1) + '</td><td>' + d.q + '</td><td>' + d.chosen + '</td><td>' + d.correct + '</td><td style="color:' + (d.ok?'#22c55e':'#ef4444') + '">' + (d.ok?'OK':'KO') + '</td></tr>';
  });
  msg += '</table></div>';
  
  msg += '<div class="nav"><button class="sec" onclick="render()">Accueil</button><button class="exam" onclick="startExam(\'' + ex.id + '\')">Repasser</button></div>';
  
  document.getElementById('exam_res').innerHTML = msg;
  updateProg();
  window.scrollTo(0, document.body.scrollHeight - 400);
}

    html += '<div class="cert ' + status + '"><h4>' + p.titre + ' - ' + p.modules + '</h4><div style="font-size:0.85em;color:#fbbf24;font-weight:700;margin:4px 0">' + p.seuil + ' defis minimum</div><div style="font-weight:700;margin:4px 0">' + p.cert + ' <span class="badge ' + badge + '">' + (p.type==='free'?'GRATUIT':'PARTIEL') + '</span></div><div style="font-size:0.85em;color:#94a3b8;margin-top:6px">' + p.desc + '</div><div style="margin-top:8px"><a href="' + p.url + '" target="_blank">Site officiel</a></div>' + (status==='done'?'<div style="color:#86efac;font-weight:700;margin-top:8px">Certification debloquee' + (examPassed ? ' ✓ Examen reussi' : ' (examen module a passer)') + '</div>':'<div style="color:#94a3b8;margin-top:8px">Encore ' + (p.seuil-total) + ' defis</div>') + '</div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function showStats(){
  var total = countTotal(), today = countToday();
  var now = new Date();
  var dayOfWeek = now.getDay() || 7;
  var monday = new Date(now); monday.setDate(now.getDate() - dayOfWeek + 1); monday.setHours(0,0,0,0);
  var week = Object.values(state.done).filter(function(v){ return typeof v === 'string' && new Date(v) >= monday; }).length;
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var month = Object.values(state.done).filter(function(v){ return typeof v === 'string' && new Date(v) >= monthStart; }).length;
  var milestonesDone = MILESTONES.filter(function(m){ return state.done[m.seuil]; });
  
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Statistiques</h2>';
  html += '<div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + week + '</span><span class="lbl">Semaine</span></div><div class="stat"><span class="big">' + month + '</span><span class="lbl">Mois</span></div><div class="stat"><span class="big">' + total + '</span><span class="lbl">Total</span></div></div>';
  
  html += '<h3>Examens de module</h3>';
  html += '<table><tr><th>Examen</th><th>Score</th><th>Statut</th><th>Date</th></tr>';
  EXAMS.forEach(function(ex){
    var r = state.exams && state.exams[ex.id];
    var statut = r ? (r.passed ? 'REUSSI' : 'ECHOUE') : 'Non passe';
    var color = r ? (r.passed ? '#22c55e' : '#ef4444') : '#94a3b8';
    html += '<tr><td>' + ex.titre + '</td><td>' + (r ? r.score + '/' + r.total : '-') + '</td><td style="color:' + color + ';font-weight:700">' + statut + '</td><td>' + (r ? new Date(r.date).toLocaleString('fr-FR') : '-') + '</td></tr>';
  });
  html += '</table>';
  
  html += '<h3>Projets majeurs atteints</h3>';
  if (milestonesDone.length === 0) {
    html += '<p style="color:#94a3b8">Aucun projet majeur encore atteint.</p>';
  } else {
    html += '<ul>';
    milestonesDone.forEach(function(m){ html += '<li><b>' + m.titre + '</b> - ' + m.date + '<br><span style="color:#94a3b8;font-size:0.85em">' + m.desc + '</span></li>'; });
    html += '</ul>';
  }
  html += '<h3>Historique defis (20 dernieres)</h3><table><tr><th>Defi</th><th>Titre</th><th>Date</th></tr>';
  var entries = Object.entries(state.done).sort(function(a,b){ return new Date(b[1]) - new Date(a[1]); });
  entries.slice(0, 20).forEach(function(e){
    var d = D.filter(function(x){ return x.id === +e[0]; })[0];
    html += '<tr><td>' + e[0] + '</td><td>' + (d?d.t:'?') + '</td><td>' + new Date(e[1]).toLocaleString('fr-FR') + '</td></tr>';
  });
  html += '</table></div>';
  app.innerHTML = html;
}

function showJobs(){
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Emplois en Cote dIvoire</h2>';
  JOBS.forEach(function(j){
    html += '<div class="job"><h4>' + j.nom + '</h4><div style="font-size:0.75em;color:#94a3b8">' + j.type + '</div><div style="margin:6px 0;font-size:0.88em">' + j.desc + '</div><a href="' + j.url + '" target="_blank">' + j.url + '</a></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function reset(){
  if (confirm('Reinitialiser toute la progression (defis + examens) ?')) {
    localStorage.removeItem('cyber_ci');
    location.reload();
  }
}

render();
</script>
</body>
</html>
